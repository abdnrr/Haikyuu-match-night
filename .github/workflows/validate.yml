name: HTML Validation

on:
  push:
    branches: [main]
    paths:
      - '*.html'
  pull_request:
    branches: [main]
    paths:
      - '*.html'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install -g html-validate
      - run: html-validate index.html
        continue-on-error: true
